# Skills Lens dataset refresh — manual, best-effort fetch, honest fallback,
# and a human reads the result before any of it reaches master.
#
# stats.nba.com blocks most datacenter IPs, so the fetch step is expected
# to no-op on GitHub runners more often than not; the run still rebuilds
# skills deterministically from the committed cache/vectors, runs the
# invariant gates and appends the growth ledger. Fresh season pulls happen
# on an operator machine per docs/DATA_SOURCES_DEEP.md rate-limit policy.
#
# This used to run every Monday with `contents: write` and end in
# `git commit` + `git push` to master, and pushing master deploys the site.
# What it would have pushed included assets/vectors.json rebuilt by
# build_vectors alone: update_dataset.py did not run enrich_vectors.py (it
# does since 2026-10-09), the only step that sets each player's position
# `p`, so the file would have
# lost positions (12,925 / 12,966 rows carry `p` today) and the next matrix
# rebuild would train the position head on nothing. Pushes made with
# GITHUB_TOKEN also do not trigger ci.yml, so no gate would have run on the
# bot's commit. All 8 scheduled runs (2026-07-13 to 08-31) failed at a
# required gate before the push; that accident was the only safeguard.
#
# So now: workflow_dispatch only, read-only token, --keep-vectors (skills
# come from the committed vectors.json), and the refreshed files are
# uploaded as an artifact (a patch plus its diffstat) for someone to review
# and apply by hand, through a PR that CI checks.
name: skills-dataset-refresh

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy + pytest: the gates update_dataset.py runs are pytest modules.
      - run: pip install -r pipeline/requirements.txt
      - name: Update dataset (fetch best-effort, rebuild skills, gate, ledger)
        run: python pipeline/update_dataset.py --keep-vectors
      - name: Collect the refreshed files for review
        run: |
          mkdir -p refresh
          git add assets/skills.json assets/skill_probe.json pipeline/cache/
          git diff --cached --stat | tee refresh/diffstat.txt
          git diff --cached --binary > refresh/skills-dataset-refresh.patch
      - uses: actions/upload-artifact@v4
        with:
          name: skills-dataset-refresh
          path: refresh/
          if-no-files-found: error
