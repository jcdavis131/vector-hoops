# Skills Lens dataset refresh — manual, best-effort fetch, honest fallback,
# and a human reads the result before any of it reaches master.
#
# stats.nba.com blocks most datacenter IPs, so the fetch step is expected
# to no-op on GitHub runners more often than not; the run then rebuilds
# skills deterministically from the committed cache/vectors and runs the
# invariant gates. Fresh season pulls happen on an operator machine per
# docs/DATA_SOURCES_DEEP.md rate-limit policy.
#
# RED today, on both lines, by known causes [final#13, final#20]. Each
# required step that fails stops update_dataset.py (run_step raises
# SystemExit), so no ledger row is written and the Collect and upload steps
# below never run: no patch artifact comes out of it yet.
#   - "rebuild scoring lite": build_scoring_lite refuses an f32 that no
#     assets/mtnn_lineage.json names. Neither line has one (master serves
#     the July v5 export, this branch the 2dc6ad78 smoke model). Green after a
#     run is promoted (pipeline/promote.py) and exported.
#   - "feature-hygiene gates" and "promote-gate tests": their script forms
#     set HOOPS_REQUIRE_LOCAL_DATA=1, and they read gitignored pipeline/data
#     (train_matrix.npz, feature_manifest.json, mtnn_report.json), which a
#     runner never has. No promotion fixes this; it needs a CI mode in
#     update_dataset.py that skips the box-only gates and says so, or a run
#     on the training box instead of a runner.
#   - On forge/backend-hardening only, "eval-scoreboard gates" fails first:
#     the served f32 is the 2dc6ad78 smoke model, below the honesty floors,
#     and the script form runs --runxfail [eval#0]. On master, where the f32
#     is the v5 export, the rebuilt board passes its gates (measured
#     2026-10-11 on master's assets: 7 passed; mtnn test top5 0.7497 on
#     747 pairs).
# Steps before those were not run on a runner for this note.
#
# This used to run every Monday with `contents: write` and end in
# `git commit` + `git push` to master, and pushing master deploys the site.
# What it would have pushed included assets/vectors.json rebuilt by
# build_vectors alone: update_dataset.py did not run enrich_vectors.py (it
# does since 2026-10-09), the only step that sets each player's position
# `p`, so the file would have
# lost positions (12,925 / 12,966 rows carry `p` today) and the next matrix
# rebuild would train the position head on nothing. Pushes made with
# GITHUB_TOKEN also do not trigger ci.yml, so no gate would have run on the
# bot's commit. All 8 scheduled runs (2026-07-13 to 08-31) failed at a
# required gate before the push; that accident was the only safeguard.
#
# So now: workflow_dispatch only, read-only token, --keep-vectors (skills
# come from the committed vectors.json), and once every required step
# passes, the refreshed files are uploaded as an artifact (a patch plus its
# diffstat) for someone to review and apply by hand, through a PR that CI
# checks. The `git add` below names skills.json, skill_probe.json and
# pipeline/cache/ only; the run also rewrites other assets (the eval
# scoreboard among them), so widen it before relying on the patch.
name: skills-dataset-refresh

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy + pytest: the gates update_dataset.py runs are pytest modules.
      - run: pip install -r pipeline/requirements.txt
      - name: Update dataset (fetch best-effort, rebuild skills, gate, ledger)
        run: python pipeline/update_dataset.py --keep-vectors
      - name: Collect the refreshed files for review
        run: |
          mkdir -p refresh
          git add assets/skills.json assets/skill_probe.json pipeline/cache/
          git diff --cached --stat | tee refresh/diffstat.txt
          git diff --cached --binary > refresh/skills-dataset-refresh.patch
      - uses: actions/upload-artifact@v4
        with:
          name: skills-dataset-refresh
          path: refresh/
          if-no-files-found: error
