name: Ruff Lint
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same version as .pre-commit-config.yaml (rev v0.15.22) and pyproject's
      # dev extra. Bump all three together, or the hook and CI disagree again.
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: Ruff check
        run: ruff check . --statistics
      - name: Ruff format check
        run: ruff format --check .
