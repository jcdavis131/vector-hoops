name: Ruff Lint
on:
  push:
    branches: [master, main]
  pull_request:
    # forge/** too: a PR stacked on a forge/ branch (base is the parent PR's branch)
    # is gated by the same jobs before it is retargeted to master.
    branches: [master, main, 'forge/**']
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same version as .pre-commit-config.yaml (rev v0.15.22) and pyproject's
      # dev extra. Bump all three together, or the hook and CI disagree again.
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: Ruff check
        run: ruff check . --statistics
      - name: Ruff format check
        run: ruff format --check .
  css-braces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A single missing `}` in atlas.css once silently swallowed ~18 rules
      # (the Fig.1 axes + honesty strip shipped unstyled). stdlib, no deps.
      # Also enforces the root -> public/ byte-identical mirror rule.
      - name: Check CSS brace balance
        run: python3 scripts/check_css_braces.py .
