[project]
name = "vector-hoops"
version = "5.0.0"
description = "NBA chimera search over MTNN embeddings - 12,966 player-seasons, leakfree MTNN v5"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# scipy and tqdm were declared and never imported -- 0 `import scipy` and
# 0 `import tqdm` across every .py in this repo. scikit-learn STAYS: it is
# imported by 8 files, and by derive_system_tags.py at module scope
# (`from sklearn.cluster import KMeans`), so dropping it breaks that script on
# a clean `pip install -e .`.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "requests>=2.28",
    "nba_api>=1.2.0",
    "vector-core @ git+https://github.com/jcdavis131/vector-hub.git#subdirectory=packages/vector-core",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.2",
    "pre-commit>=3.6",
    "pytest>=7.0",
]
manim = [
    "manim>=0.17",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    ".mypy_cache",
    "pipeline/cache",
    "pipeline/data",
    "node_modules",
    "assets/manim/media",
    "pipeline/fetch_*.py",
    "pipeline/build_front_office.py",
    "pipeline/build_front_office_by_season.py",
    # public/assets/manim/src/*.py is a byte-identical copy of assets/manim/src/*.py,
    # committed only as part of the Vercel `public/` static-site mirror (frontend
    # deploy fix 28e5fc47). Not source of truth; excluded to avoid double-linting it.
    "public/assets/manim",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = [
    "S101",
    "S603",
    "S607",
    "E501",
    "N806",
    "N803",
    "N812",
    "RUF001",
    "RUF002",
    "RUF003",
    "B905",
    "RUF007",
    "UP035",
    "UP006",
    "UP045",
    "W293",
    "C408", "C420", "C401", "C416",
    "RUF005", "RUF046", "RUF010", "RUF059", "RUF100", "RUF019", "RUF021", "RUF022", "RUF034",
    "S110", "S112",
    "S310", "S311", "S324",
    "B007",
    "PTH120", "PTH123", "PTH119", "PTH207",
    "S113",
    "TC003",
    "UP012", "UP031",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"assets/manim/src/*.py" = ["F405", "F403", "F401", "E402", "E741", "F841", "W293", "E501", "E401", "E701", "E702", "I001"]
"pipeline/*test*.py" = ["S101", "S603", "S607", "F401", "E402"]
"pipeline/build_*.py" = ["E402", "S603", "S607", "E722", "F401", "I001", "E401", "E701", "E702", "F841", "B023", "C414", "RUF013", "RUF057", "PTH118"]
"pipeline/train_mt.py" = ["E402", "E701", "E702"]
"pipeline/train_mt_v53.py" = ["E701", "E702", "N816"]
"operator/mlops_cli.py" = ["E702"]
"pipeline/train_mtnn.py" = ["E402", "S603"]
"pipeline/export_*.py" = ["E402"]
"scripts/*.py" = ["E402", "S603", "F401", "E401", "E701", "E702", "F541", "B023", "W605", "F841", "I001"]
# Pre-existing style debt, byte-identical on master (not touched by this branch):
"pipeline/train_factory.py" = ["E401", "F401", "F541", "I001"]
"pipeline/train_quick_wins.py" = ["E401", "E701", "E702", "E722", "F401", "F841", "I001"]
"tmp/gen_valuations.py" = ["E401", "E402", "F401", "F601", "I001", "PTH103", "PTH111"]
# LOCAL-GPU v6 192d lane (feat: PWA v67, 2dc6ad78) — same terse one-liner
# training-script style as the other pipeline/train_*.py entries above.
"pipeline/train_mtnn_v6_192d.py" = ["E401", "E701", "E702", "E722", "F541", "F841", "I001", "N801"]
"pipeline/train_mtnn_v6_192d_cpu.py" = ["E401", "E701", "E702", "E722", "E731", "F401", "I001", "W291"]
"pipeline/train_mtnn_v6_192d_gated.py" = ["C413", "E401", "E701", "E702", "F401", "F541", "F841", "I001", "RUF015"]
"pipeline/train_mtnn_v6_cpu.py" = ["E401", "E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
known-third-party = ["numpy", "pandas", "torch", "sklearn", "requests", "nba_api", "manim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
# Pre-existing files whose formatting predates the formatter gate, byte-identical
# on master; excluded from `ruff format --check` so they are not reformatted.
exclude = [
    "assets/manim/src/v01_vector_space.py",
    "assets/manim/src/v02_input_families.py",
    "assets/manim/src/v03_mtnn_towers.py",
    "assets/manim/src/v04_embedding_l2.py",
    "assets/manim/src/v05_chimera.py",
    "assets/manim/src/v06_archetypes_skills_drift.py",
    "pipeline/train_factory.py",
    "pipeline/train_quick_wins.py",
    "tmp/gen_valuations.py",
    # One-off browser QA/smoke scripts, terse one-liner style by convention,
    # not reformatted to avoid unrelated diff noise on scripts owned by other lanes.
    "scripts/*.py",
    # Active ML pipeline/training files under parallel development (LOCAL-GPU
    # v6 GPU lane etc.); left unformatted here to avoid unrelated whitespace
    # churn colliding with in-flight branches. Formatting predates the gate.
    "pipeline/build_embedding_map_manifest.py",
    "pipeline/hill_climb.py",
    "pipeline/resolve_fusion.py",
    "pipeline/train_career_mtnn.py",
    "pipeline/train_mt.py",
    "pipeline/train_mtnn.py",
    "pipeline/train_towers.py",
    "pipeline/train_mtnn_v6_192d.py",
    "pipeline/train_mtnn_v6_192d_cpu.py",
    "pipeline/train_mtnn_v6_192d_gated.py",
    "pipeline/train_mtnn_v6_cpu.py",
]

[tool.pytest.ini_options]
testpaths = ["pipeline"]
python_files = ["test_*.py"]
addopts = "-q"
