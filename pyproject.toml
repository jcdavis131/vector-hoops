[project]
name = "vector-hoops"
version = "5.0.0"
description = "NBA chimera search over MTNN embeddings - 12,966 player-seasons, leakfree MTNN v5"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "requests>=2.28",
    "tqdm>=4.65",
    "nba_api>=1.2.0",
    "vector-core @ git+https://github.com/jcdavis131/vector-hub.git#subdirectory=packages/vector-core",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.2",
    "pre-commit>=3.6",
    "pytest>=7.0",
]
manim = [
    "manim>=0.17",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    ".mypy_cache",
    "pipeline/cache",
    "pipeline/data",
    "node_modules",
    "assets/manim/media",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = [
    "S101",
    "S603",
    "S607",
    "E501",
    "N806",
    "N803",
    "N812",
    "RUF001",
    "RUF002",
    "RUF003",
    "B905",
    "RUF007",
    "UP035",
    "UP006",
    "UP045",
    "W293",
    "C408", "C420", "C401", "C416",
    "RUF005", "RUF046", "RUF010", "RUF059", "RUF100", "RUF019", "RUF021", "RUF022", "RUF034",
    "S110", "S112",
    "S310", "S311", "S324",
    "B007",
    "PTH120", "PTH123", "PTH119", "PTH207",
    "S113",
    "TC003",
    "UP012", "UP031",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"assets/manim/src/*.py" = ["F405", "F403", "F401", "E402", "E741", "F841", "W293", "E501"]
"pipeline/*test*.py" = ["S101", "S603", "S607", "F401", "E402"]
"pipeline/build_*.py" = ["E402", "S603", "S607", "E722", "F401", "I001", "E401", "E701", "E702", "F841", "B023", "C414", "RUF013", "RUF057"]
"pipeline/fetch_*.py" = ["E402", "S603", "S113", "E722", "F401", "I001", "E401", "E701", "E702", "F841", "B023", "C414", "RUF013", "RUF057"]
"pipeline/build_front_office.py" = ["E701", "E702", "I001"]
"pipeline/train_mt.py" = ["E402", "E701", "E702"]
"pipeline/train_mt_v53.py" = ["E701", "E702", "N816"]
"operator/mlops_cli.py" = ["E702"]
"pipeline/fetch_preseason_odds.py" = ["E701"]
"pipeline/train_mtnn.py" = ["E402", "S603"]
"pipeline/export_*.py" = ["E402"]
"scripts/*.py" = ["E402", "S603", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
known-third-party = ["numpy", "pandas", "torch", "sklearn", "scipy", "requests", "nba_api", "manim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["pipeline"]
python_files = ["test_*.py"]
addopts = "-q"
