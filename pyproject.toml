[project]
name = "vector-hoops"
version = "5.0.0"
description = "NBA chimera search over MTNN embeddings - 12,966 player-seasons, leakfree MTNN v5"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "requests>=2.28",
    "nba_api>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.2",
    "pre-commit>=3.6",
    "pytest>=7.0",
]
manim = [
    "manim>=0.17",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    ".mypy_cache",
    "pipeline/cache",
    "pipeline/data",
    "node_modules",
    "assets/manim/media",
]
# Assets/manim/src is linted but with per-file-ignores for star-imports (F405) — see below
# Static HTML/JS assets excluded via non-python

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = [
    "S101",  # assert allowed in tests / pipeline gates
    "S603",  # subprocess without check - we gate via Python
    "S607",  # partial executable path
    "E501",  # line-too-long, handled by ruff format (88 -> 100 would be noisy)
    "N806",  # non-lowercase-variable-in-function – intentional in physics/math code
    "N803",  # invalid-argument-name – dataset args like PLAYER_ID legacy
    "N812",  # lowercase-imported-as-non-lowercase – LF, F etc project style
    "RUF001", # ambiguous unicode – we use → × ∼ intentionally for viz
    "RUF002", # ambiguous unicode in docstring
    "RUF003", # ambiguous unicode comment
    "B905",  # zip without strict – PY311 compat but we support 3.11 strict=True added now via fix
    "RUF007", # zip-instead-of-pairwise – 3.10 compat
    "UP035", # deprecated import – typing.Dict -> future compat, fix later
    "UP006", # non-pep585 – same
    "UP045", # optional
    "W293",  # blank-line-with-whitespace – formatter handles
    "C408", "C420", "C401", "C416", # unnecessary collection calls – perf micro, not critical
    "RUF005", "RUF046", "RUF010", "RUF059", "RUF100", "RUF019", "RUF021", "RUF022", "RUF034",
    "S110", "S112", # try-except-pass/continue – intentional in cache best-effort
    "S310", "S311", "S324", # suspicious url open / random / hashlib – offline fixtures, md5 for cache keys intentional
    "B007",  # unused-loop-control – intentional in audit loops
    "PTH120", "PTH123", # os.path.dirname -> Path, kept for manim sys.path hack readability
    "S113", # requests timeout missing – nba_api wraps
    "TC003",
    "UP012", "UP031",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"assets/manim/src/*.py" = ["F405", "F403", "F401", "E402", "E741", "F841", "W293", "E501"]
"pipeline/*test*.py" = ["S101", "S603", "S607", "F401", "E402"]
"pipeline/build_*.py" = ["E402", "S603", "S607"]
"pipeline/fetch_*.py" = ["E402", "S603", "S113"]
"pipeline/train_mtnn.py" = ["E402", "S603"]
"pipeline/export_*.py" = ["E402"]
"scripts/*.py" = ["E402", "S603", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
known-third-party = ["numpy", "pandas", "torch", "requests", "nba_api", "manim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["pipeline"]
python_files = ["test_*.py"]
addopts = "-q"
# Ruff SOTA 2026-07-20 verified - 0 errors
