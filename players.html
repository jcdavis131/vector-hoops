<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0C10"><title>Vector Hoops — Players Explorer 1814 filt</title>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiUGxheWVycyJ9">
<style>
:root{--paper:#FFFEF7;--void:#080A0F;--ink:#1A150F;--yellow:#F0E442;--orange:#FF5A1F;--g:#E7F6EA;--r:#FFD8D5;--y:#FFE9B5}
*{box-sizing:border-box}html,body{margin:0;background:var(--void);color:var(--paper);font-family:ui-sans,system-ui;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
.card{background:#FFFEFB;color:var(--ink);border:2.2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:var(--yellow);border:1.5px solid var(--ink);font-weight:800;font-size:11px}
canvas{display:block;width:100%;height:420px;background:radial-gradient(1100px 600px at 18% -10%,#1E2B44 0%,#101724 32%,var(--void) 72%)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:10px}
.it{border:1.5px solid var(--ink);border-radius:10px;padding:8px;background:#fff;cursor:pointer}
.it:hover{transform:translateY(-1px)} .it.on{background:var(--yellow)}
.mono{font-family:ui-monospace,monospace;font-size:11px}
</style></head><body><div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">1814 players • current+allstars+3+ • 1764 pts</span><a class="pill" href="/">← Map</a></div>
<div class="card" style="margin-top:10px"><canvas id="c" width="900" height="460"></canvas>
<div style="display:flex;justify-content:space-between;padding:8px"><span class="mono" id="lab">loading 1764 pts</span><span class="mono"><button id="bAll">Show All 3+ only</button> <button id="bCur">Current only 532</button> <button id="bToggleFull">?full</button></span></div></div>
<div id="list" class="list"></div>
<script>
const OKABE=['#0072B2','#D55E00','#009E73','#CC79A7','#F0E442','#56B4E9','#E69F00','#000000'];
const $=s=>document.getElementById(s);
let dots=[], yaw=0, trajCache={}, curTraj=null;
let cv=$('c'), ctx=cv.getContext('2d'), W=900,H=460, DPR=Math.min(devicePixelRatio||1,2);
cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR); W=900; H=460;
async function loadPts(filter='all'){
 let res=await fetch('assets/embedding_map_points_limited.json'); let data=await res.json();
 dots=data.points.filter(p=>{
  if(filter==='current') return p.is_current;
  if(filter==='allstar') return p.is_allstar;
  return true;
 }).map(p=>({x:(p.x-0.5)*2,y:(p.y-0.5)*2,z:((p.z||0.5)-0.5)*2,r:p.is_current?1.0:0.7,col:OKABE[p.c%8],pid:p.pid,nm:p.display_name,season:p.season,alpha:p.is_current?0.9:0.75}));
 $('lab').textContent='pts '+dots.length+' filter '+filter+' mem save 86% vs 12966';
 renderList();
}
async function loadTraj(){
 if(Object.keys(trajCache).length) return trajCache;
 let j=await (await fetch('assets/embedding_map_trajectories.json')).json();
 trajCache=j.trajectories||{};
 return trajCache;
}
function renderList(){
 let l=$('list'); l.innerHTML='';
 dots.slice(0,80).forEach(d=>{
   let div=document.createElement('div'); div.className='it';
   div.innerHTML='<b>'+d.nm+'</b><div class=mono>'+d.season+' • '+(d.pid)+'</div>';
   div.onclick=()=>selectPid(d.pid);
   l.appendChild(div);
 });
}
async function selectPid(pid){
 let trajs=await loadTraj();
 let traj=trajs[String(pid)];
 if(!traj) return;
 curTraj=traj;
 $('lab').textContent='trajectory '+traj.length+' seasons '+traj[0].season+'→'+traj[traj.length-1].season+' • grey→orange change';
}
$('bAll').onclick=()=>loadPts('all');
$('bCur').onclick=()=>loadPts('current');
$('bToggleFull').onclick=()=>location.search='?full=1';

function draw(){
 ctx.clearRect(0,0,W,H);
 yaw+=0.004;
 let ct=Math.cos(yaw), st=Math.sin(yaw), cx=W*0.5, cy=H*0.51, sc=Math.min(W,H)*0.42;
 for(let d of dots){
  let x=d.x*ct - d.z*st, z=d.x*st + d.z*ct, y=d.y, dep=(z+1)*0.5+0.12;
  let px=cx+x*sc*dep, py=cy+y*sc*dep*0.86;
  ctx.beginPath(); ctx.fillStyle=d.col; ctx.globalAlpha=0.16+dep*0.62*d.alpha; ctx.arc(px,py,d.r*2.2,0,Math.PI*2); ctx.fill();
 }
 if(curTraj){
  ctx.globalAlpha=1; ctx.strokeStyle='#FF5A1F'; ctx.lineWidth=1.6; ctx.beginPath();
  let first=true;
  curTraj.forEach(pt=>{
   let xv=(pt.x-0.5)*2,yv=(pt.y-0.5)*2,zv=((pt.z||0.5)-0.5)*2;
   let xx=xv*ct - zv*st, zz=xv*st+zv*ct, dep=(zz+1)*0.5+0.12;
   let px=cx+xx*sc*dep, py=cy+yv*sc*dep*0.86;
   if(first){ctx.moveTo(px,py);first=false}else ctx.lineTo(px,py);
  }); ctx.stroke();
 }
 requestAnimationFrame(draw);
}
loadPts('all'); requestAnimationFrame(draw);
</script></div></body></html>
