<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect x="0" y="0" width="1200" height="630" fill="#fafaf8"/>
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#111111" stroke-width="4" rx="14"/>

  <!-- half-court accent, faint -->
  <g stroke="#111111" stroke-opacity="0.14" stroke-width="3" fill="none">
    <rect x="470" y="120" width="260" height="300"/>
    <circle cx="600" cy="420" r="95"/>
    <path d="M 380 40 A 320 320 0 0 0 380 600" />
  </g>

  <text x="120" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="800" letter-spacing="2">
    <tspan fill="#111111">VECTOR</tspan><tspan fill="#eb6834">HOOPS</tspan>
  </text>

  <line x1="120" y1="260" x2="640" y2="260" stroke="#eb6834" stroke-width="6"/>

  <text x="120" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#111111">
    the daily NBA chimera
  </text>

  <text x="120" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#52514e">
    Two eras of stats, fused into one player-season.
  </text>
  <text x="120" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#52514e">
    Guess it in six. Era-honest, one puzzle a day.
  </text>

  <text x="120" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#898781" letter-spacing="1">
    12,392 PLAYER-SEASONS &#183; 1996-97 THROUGH 2025-26
  </text>
</svg>
